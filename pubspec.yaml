name: flutter_catalog
description: An app showcasing Flutter components, with side-by-side source code view.

version: 4.0.0+99

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

publish_to: none

dependencies:
  # ! Vendored: upstream pins the unmaintained font_awesome_flutter 9.x.
  animated_radial_menu:
    path: packages/animated_radial_menu
  animated_text_kit:
  animations:
  async:
  backdrop:
  badges:
  cached_network_image:
  community_charts_flutter:
  chat_gpt_sdk: ^3.1.6
  cloud_firestore: ^6.0.0
  community_material_icon:
  convex_bottom_bar:
  day_night_switcher:
  device_preview:
  device_preview_screenshot:
  device_frame:
  english_words:
  extended_image:
  feature_discovery:
  ffi:
  firebase_analytics: ^12.0.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  firebase_ui_auth:
  firebase_ui_oauth_google:
  fl_chart:
  flutter:
    sdk: flutter
  flutter_bloc:
  flutter_gallery_assets:
  flutter_heatmap_calendar:
  flutter_highlight:
  flutter_markdown_plus:
  flutter_radar_chart:
  flutter_riverpod:
  flutter_slidable:
  flutter_state_notifier:
  flutter_whatsnew:
    path: packages/flutter_whatsnew-master
  fluttertoast:
  freezed_annotation:
  google_fonts:
  # ! The `google_ml_kit` umbrella package bundles *every* ML Kit model
  # ! (translate, digital ink, pose, entity extraction, ...) and inflated the
  # ! release APK to 334MB. Only the four features used by the demo are pulled.
  google_mlkit_barcode_scanning:
  google_mlkit_face_detection:
  google_mlkit_image_labeling:
  google_mlkit_text_recognition:
  google_mobile_ads:
  google_sign_in:
  graphview:
  hidable:
  hive_ce:
  hive_ce_flutter:
  http:
  image:
  image_picker:
  in_app_purchase:
  in_app_review:
  intl:
  introduction_screen:
  like_button:
  local_auth:
  lottie:
  markdown:
  package_info_plus:
  path:
  path_provider:
  photo_view:
  provider:
  scoped_model:
  selectable:
  sembast:
  share_plus:
  shared_preferences:
  shimmer:
  sqflite:
  state_notifier:
  substring_highlight:
  super_editor:
  transparent_image:
  tuple:
  url_launcher:
  video_player:
  widget_with_codeview:
  youtube_player_iframe:

# ! `device_preview` is vendored under packages/ so that the platform tabs of
# ! the "Device model" picker follow the order android / iOS / windows / linux /
# ! macOS (`_allPlatforms` is a private const upstream). An override is needed
# ! because `device_preview_screenshot` depends on it too.
dependency_overrides:
  device_preview:
    path: packages/device_preview

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_launcher_icons:
  flutter_native_splash:
  freezed: ^3.0.0
  hive_ce_generator:
  json_serializable:
  lint:

# $ dart run flutter_launcher_icons
# Cf. https://pub.dev/packages/flutter_launcher_icons
flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: res/images/app_icon.png

# $ dart run flutter_native_splash:create
# Cf. https://pub.dev/packages/flutter_native_splash
flutter_native_splash:
  color: "#f6f6f6"
  image: res/images/app_icon.png

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
  # Note: when new assets are added, have to run `flutter clean` to see
  # changes take effect.
  assets:
    - CHANGELOG.md
    # *Tip*: keep the slash at the end of folder path adds all files to
    # assets. Note: this doesn't work with subfolders.
    # c.f. https://github.com/flutter/flutter/issues/4890#issuecomment-407327749
    - lib/routes/
    - lib/routes/data/
    - res/images/
    - res/lottie/
    - packages/flutter_gallery_assets/animated_images/animated_flutter_stickers.webp
    - screenshots/Screenshot_1541613187.png
    - screenshots/Screenshot_1541613193.png
    - screenshots/Screenshot_1541613197.png
